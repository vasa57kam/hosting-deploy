<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Панель{% endblock %} · Хостинг ITKAM34</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;font-size:14px}
nav{background:#010409;border-bottom:1px solid #21262d;padding:10px 16px;display:flex;gap:10px;align-items:center}
nav b{color:#3fb950}nav a{color:#9da7b3;text-decoration:none;padding:6px 10px;border-radius:8px}nav a:hover{background:#161b22;color:#fff}
main{max-width:1000px;margin:22px auto;padding:0 14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 12px}h3{margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:#8b949e;text-align:left;padding:8px;border-bottom:1px solid #30363d}td{padding:8px;border-bottom:1px solid #21262d}
.btn{display:inline-block;background:#238636;color:#fff;border:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin:2px}
.btn.sec{background:#30363d}.btn.danger{background:#da3633}.btn.warn{background:#9e6a03}
input,select{width:100%;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:9px;padding:9px 11px;font-size:14px;margin:5px 0 12px}
label{font-size:12px;color:#8b949e;font-weight:600}
.ok{color:#3fb950}.bad{color:#f85149}.mut{color:#8b949e}
pre{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;max-height:320px;overflow:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
</style></head><body>
<nav><b>🌐 Хостинг ITKAM34</b><a href="/">Сайты</a><span style="flex:1"></span><a href="/logout">Выйти</a></nav>
<main>{% block content %}{% endblock %}</main></body></html>
